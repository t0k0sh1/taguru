# Keep local baselines and the changed-code CI job reproducible against the
# committed dependency graph. A three-times-baseline timeout still catches
# loop-inducing mutants without treating ordinary CI variance as a hang.
additional_cargo_args = ["--locked"]
profile = "mutants"
timeout_multiplier = 3.0

# nextest runs the suite's test binaries in one parallel pool with
# fail-fast across all of them, where `cargo test` runs binary by
# binary in series: a caught mutant surfaces at its first failing test
# instead of waiting out every binary scheduled before it. Measured on
# the #428 api sweep, that halved the median time-to-catch (231s →
# 102s) and cut the whole-run cost by about a third. Per-test hang
# containment lives in .config/nextest.toml.
test_tool = "nextest"

# dispatch_chunks_concurrently's `index` always comes from a fresh
# next.fetch_add claim, and first_failure only ever holds a value some
# earlier claim already consumed — index can never equal first_failure, so
# `>` and `>=` are equivalent there, not a missing test (the sibling `==`
# and `<` mutants on the same comparison are caught).
exclude_re = [
    "replace > with >= in dispatch_chunks_concurrently",
    # stage_bytes's real (non-injected) AlreadyExists match guard,
    # `with true` arm only (issue #587): a permanent, non-collision
    # open failure (EACCES, ENOSPC, ...) that the guard would wrongly
    # treat as retriable still ends the retry loop with the SAME error
    # kind the correct code returns immediately — every attempt fails
    # identically, so no black-box test (return value or filesystem
    # state) can tell "retried 8 times then gave up" apart from "gave
    # up immediately". The `with false` sibling on this same guard IS
    # killed (a genuine collision must retry-and-succeed, not fail
    # outright) — see stage_bytes_retries_past_a_genuine_open_collision.
    "replace match guard error\\.kind\\(\\) == io::ErrorKind::AlreadyExists with true in stage_bytes",
    # The in-process embedding provider (local-embed, on by default)
    # is exercised by an #[ignore]d smoke test that downloads a real
    # model — CI sweeps can never kill mutants there, and counting
    # them as missed would only be noise.
    "LocalEmbeddings",
    "fastembed_model",
]
