# Keep local baselines and the changed-code CI job reproducible against the
# committed dependency graph. A three-times-baseline timeout still catches
# loop-inducing mutants without treating ordinary CI variance as a hang.
additional_cargo_args = ["--locked"]
profile = "mutants"
timeout_multiplier = 3.0

# nextest runs the suite's test binaries in one parallel pool with
# fail-fast across all of them, where `cargo test` runs binary by
# binary in series: a caught mutant surfaces at its first failing test
# instead of waiting out every binary scheduled before it. Measured on
# the #428 api sweep, that halved the median time-to-catch (231s →
# 102s) and cut the whole-run cost by about a third. Per-test hang
# containment lives in .config/nextest.toml.
test_tool = "nextest"

# dispatch_chunks_concurrently's `index` always comes from a fresh
# next.fetch_add claim, and first_failure only ever holds a value some
# earlier claim already consumed — index can never equal first_failure, so
# `>` and `>=` are equivalent there, not a missing test (the sibling `==`
# and `<` mutants on the same comparison are caught).
exclude_re = [
    "replace > with >= in dispatch_chunks_concurrently",
    # `compact_passages_if_worthwhile`'s watermark guard (issue #587):
    # `PassageStore::load` only ever produces `watermark() == 0`
    # together with `log_bytes == 0` and `snapshot_bytes == 0` — a
    # fresh store, or one healed back to a clean state, never a store
    # with pending log bytes and no watermark. With both at zero,
    # `compact_if_log_outgrew_snapshot`'s own condition
    # (`log_bytes > floor_bytes.max(ratio * snapshot_bytes)`) is
    # `0 > floor_bytes.max(0)`, false for every `floor_bytes: u64`
    # regardless of this guard — no test can observe a difference
    # because there is none to observe.
    "replace match guard store\\.watermark\\(\\) > 0 with true in AppState::compact_passages_if_worthwhile",
    # Same guard, the `>` -> `>=` operator mutation specifically:
    # `watermark(): u64` can never be negative, so `watermark() >= 0`
    # is a tautology — identical to `true` for every possible value,
    # not just zero. Same equivalence as the entry above, different
    # mutation operator on the same expression.
    "replace > with >= in AppState::compact_passages_if_worthwhile",
    # stage_bytes's real (non-injected) AlreadyExists match guard,
    # `with true` arm only (issue #587): a permanent, non-collision
    # open failure (EACCES, ENOSPC, ...) that the guard would wrongly
    # treat as retriable still ends the retry loop with the SAME error
    # kind the correct code returns immediately — every attempt fails
    # identically, so no black-box test (return value or filesystem
    # state) can tell "retried 8 times then gave up" apart from "gave
    # up immediately". The `with false` sibling on this same guard IS
    # killed (a genuine collision must retry-and-succeed, not fail
    # outright) — see stage_bytes_retries_past_a_genuine_open_collision.
    "replace match guard error\\.kind\\(\\) == io::ErrorKind::AlreadyExists with true in stage_bytes",
    # The in-process embedding provider (local-embed, on by default)
    # is exercised by an #[ignore]d smoke test that downloads a real
    # model — CI sweeps can never kill mutants there, and counting
    # them as missed would only be noise.
    "LocalEmbeddings",
    "fastembed_model",
    # `Bm25Index::explain`'s `tf > 0.0` guard (issue #604): when
    # `tf == 0.0`, `contribution(idf, 0.0, ...)` is `idf * 0.0 / d`
    # for some nonzero `d` — exactly 0.0 for every finite, non-NaN
    # `idf` (which `idf()` always produces, since its `ln` argument
    # is always >= 1.0). That's bit-for-bit the same value the
    # `else` arm's literal `0.0` would return, so `tf >= 0.0` (also
    # always true, `tf` is never negative) picks the SAME branch
    # value at the only boundary where it disagrees with `tf > 0.0`
    # — no test can observe a difference because there is none to
    # observe. `explain`'s single `>` operator makes this pattern
    # unambiguous within the function; unlike the sibling `==`/`<`
    # mutants here (which DO change the addend when `tf > 0.0` and
    # are caught), only the `>=` variant is this tautology.
    "replace > with >= in Bm25Index::explain",
    # `newest_fence`'s max-so-far comparison (issue #618): every fence
    # object's name is that generation's decimal key, written at most
    # once each (`claim`'s `PutMode::Create` refuses a second write to
    # the same name), so one listing pass can never present the same
    # generation twice — `fence.generation == generation` never holds
    # mid-loop, and `<=` computes the identical `newest` to `<` for
    # every possible listing.
    "replace < with <= in newest_fence",
    # `ReplicateConfig::from_env`'s interval floor (issue #618): at
    # `requested == 100` (the only value where `<` and `<=` disagree),
    # both arms compute the same `Duration::from_millis(100)` — the
    # floor branch explicitly, the else branch because `requested`
    # already IS 100 — so the mutant produces the identical `interval`
    # for every possible input; only the warn log (uncaptured by any
    # test here) would differ.
    "replace < with <= in ReplicateConfig::from_env",
    # `Shipper::ship_lane`'s THREE identical `vanished_mid_cycle` call
    # sites (issue #618, shipper.rs:390, :426, :459) — line-anchored
    # since the guard expression is byte-identical at all three.
    # :390's "false" arm (a genuine NotFound reaching this guard IS
    # the vanished-mid-cycle case) is real-tested — see
    # a_lane_deleted_between_the_scan_and_its_own_turn_ships_nothing_not_an_error,
    # which races an earlier `scan.changed` upload to delete the lane
    # file before the lanes loop reaches it. Excluded here:
    # - :390 "true": distinguishing this needs a LOCAL fs error at
    #   this exact point that is NOT NotFound (permission denied,
    #   ELOOP, ...) — this suite has no fault-injection wrapper for
    #   `std::fs` calls (only for the `ObjectStore` trait), and the
    #   two portable ways to fake one — chmod-ing the containing
    #   directory, or a self-referential symlink — either break the
    #   SAME pausing mechanism :390's own test relies on (chmod blocks
    #   every other file under it, including the upload being paused
    #   on) or are platform-fragile.
    # - :426 and :459: no `.await` exists between `ship_lane`'s own
    #   entry and reaching them (metadata → sig check → read → prefix
    #   check → this metadata, all synchronous) — unlike :390, nothing
    #   running on this cooperative single-threaded executor can ever
    #   land between two back-to-back non-yielding `std::fs` calls
    #   within the SAME `ship_lane` invocation.
    # A real concurrent unlink/permission change at the OS level could
    # still hit any of these windows in production; no test here can
    # pin that.
    "src/ship/shipper\\.rs:390:27: replace match guard vanished_mid_cycle\\(&error\\) with true in Shipper::ship_lane",
    "src/ship/shipper\\.rs:426:31: replace match guard vanished_mid_cycle\\(&error\\) with true in Shipper::ship_lane",
    "src/ship/shipper\\.rs:426:31: replace match guard vanished_mid_cycle\\(&error\\) with false in Shipper::ship_lane",
    "src/ship/shipper\\.rs:459:35: replace match guard vanished_mid_cycle\\(&error\\) with true in Shipper::ship_lane",
    "src/ship/shipper\\.rs:459:35: replace match guard vanished_mid_cycle\\(&error\\) with false in Shipper::ship_lane",
    # `PassageAnnIndex::build`'s seed-reselection gate (issue #708):
    # `if built < target { seed = ... }` guards a recompute that is
    # only ever READ by the next loop iteration. On the very last
    # iteration (`built == target` after incrementing), `built <=
    # target` is a tautology (`built` never exceeds `target` inside
    # this loop), so the `<=` mutant performs one extra recompute of
    # `seed` right before the outer `while built < target` exits —
    # unmutated there too, so the loop ends regardless and that
    # recomputed `seed` is never read. Both arms return the identical
    # `centroids`/`lists`; no test can observe a difference because
    # there is none to observe. The sibling `==` and `>` mutants on
    # the same line ARE caught (see
    # passage_ann_index_build_breaks_similarity_ties_toward_the_earlier_centroid,
    # which pins the seed reselection actually firing).
    "replace < with <= in PassageAnnIndex::build",
    # `PassageVectorStore::load_checked`'s legacy-vs-corrupt branch
    # (issue #708): both arms of `if bytes.get(..8) ==
    # LEGACY_PASSAGE_VECTOR_MAGIC { .. } else { .. }` return the exact
    # same `Self::default()` — the only difference is which
    # `tracing::` macro fires (`info!` for the legacy case, `warn!`
    # for genuine corruption), and this suite has no log-capture
    # facility (`tracing_test`/`logs_contain` are not dependencies).
    # No black-box test — return value or otherwise — can distinguish
    # the two arms.
    "replace == with != in PassageVectorStore::load_checked",
]
