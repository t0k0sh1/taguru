name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Same pin as the mutants workflows (they name nextest as their
      # test tool in .cargo/mutants.toml); .config/nextest.toml carries
      # the per-test slow-timeout containment both rely on.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Format
        run: cargo fmt --check
      # --all-targets reaches the examples too, which cargo test never
      # builds; -D warnings holds the tree at its current zero.
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      # Unit tests (lib + server + MCP bridge), the HTTP integration
      # tests (spawn the real binary on a free port), and the QA recall
      # floor all run here; --locked pins the committed Cargo.lock.
      # nextest runs the test binaries in one parallel pool with
      # per-test process isolation and kills any test that stalls
      # (.config/nextest.toml), instead of cargo test's serial
      # binary-by-binary pass.
      - name: Test
        run: cargo nextest run --locked
      # nextest never runs doctests (rustdoc owns those). The tree has
      # none that execute today — every doc fence is `text`/`json` — but
      # this keeps a future runnable doctest from silently dropping out
      # of CI.
      - name: Doctests
        run: cargo test --doc --locked

  # Independent of `check`: no Rust toolchain needed, and a newly
  # published CVE turning this red on an unrelated PR is a different
  # signal from a fmt/clippy/test failure.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Independent of `check`: no Rust toolchain needed, and this only
  # reads the wire fixtures `cargo test` (in `check`, above) already
  # verified match the live server — it does not re-run the server
  # itself. `fetch-depth: 0` so `git show`/`git ls-tree` can reach the
  # base ref's committed fixtures (ADR 0005 §9, #301).
  contract-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # No actions/setup-python: check_contract.py and
      # check_surface_completeness.py (and check_versions.py, which the
      # former imports) use only the standard library, so the runner's
      # default python3 is fine — nothing here depends on a pinned
      # interpreter version.
      - name: Fixtures <-> shapes.json self-consistency
        run: python3 sdk/spec/check_contract.py --check
      - name: Router <-> surface.yaml completeness
        run: python3 sdk/spec/check_surface_completeness.py
      - name: Determine base ref
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            echo "ref=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          fi
      - name: Breaking-change guard
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: python3 sdk/spec/check_contract.py --base "$BASE_REF"

  # Coverage and per-PR mutation testing used to run here too. Both
  # retired to keep CI at the signals that gate a merge: coverage
  # produced a report nobody's decision hung on, and diff-scoped
  # mutants stopped fitting a CI budget the moment a PR carried a new
  # module (a ~1.5k-line diff is hundreds of mutants, each its own
  # build+test — see #140, which timed out the hour ceiling).
  # Diff-scoped mutants later returned as its own non-blocking,
  # budgeted workflow (mutants-diff.yml, #436); module-scoped sweeps
  # are dispatched from mutants-sweep.yml (#417). Neither gates a
  # merge, so neither belongs in this file.
