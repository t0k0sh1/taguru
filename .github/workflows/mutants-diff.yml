# Per-PR diff-scoped mutation check (#436): the second half of the
# review-time mutation model (Petrović & Ivanković 2018). The module
# sweeps (#417, mutants-sweep.yml) patch the baseline's holes; this
# job guards everything merged after them.
#
# A first incarnation of this check gated merges and was retired when
# PR #140's new-module diff (~1.5k lines = hundreds of mutants, each
# its own build+test) timed out the ceiling — see ci.yml's tail note.
# This one differs on exactly the points that killed that job:
#   - budgeted: `--list` counts the diff's mutants for free before
#     anything builds; an over-budget diff is a reported skip (that
#     ground belongs to a module sweep), never a timed-out runner
#   - non-blocking: missed mutants and timeouts are the job's yield,
#     reported in the run summary — only infrastructure failures
#     (baseline breakage, internal errors) turn the job red. Gating
#     is a later decision, after this has a flakiness record (#436).
#
# Reviewer surfacing (the reviewer-time half of the Google model):
# missed mutants annotate their diff lines in the Files-changed tab
# (::warning — no extra permissions) and a marker-keyed sticky comment
# carries the full list, updated in place on every push and flipped
# to an all-caught notice once the misses are fixed.
name: Mutants diff

on:
  pull_request:
    # The paths filter skips runner spin-up for doc-only PRs; diffs
    # that pass it but mutate nothing (Cargo.toml-only, test-only
    # changes) exit at the free --list step instead — the case that
    # turned the retired job red.
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mutants-diff.yml"

# A newer push to the same PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: write is only for the sticky results comment; the
# inline annotations and run summary need nothing beyond read.
permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  # Starting value, to be recalibrated once a few PRs have run. The
  # issue's sizing: a normal PR is a handful to a few dozen mutants;
  # anything bigger is new-module territory that a dispatched sweep
  # covers in shards.
  MUTANT_BUDGET: 60

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Pinned to the sweep's version: both lean on this version's
      # exit-code contract (2 = missed found, 3 = timeouts found).
      # nextest is the test tool .cargo/mutants.toml names — caught
      # mutants surface at the first failure instead of waiting out
      # the binary-by-binary serial suite.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.143
      - name: Build pull-request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff "$BASE_SHA...$HEAD_SHA" > pr.diff
      # --list parses sources without building, so the budget decision
      # costs seconds whatever the diff size.
      - name: Count mutants in the diff
        id: budget
        run: |
          cargo mutants --in-diff pr.diff --list > mutants-list.txt
          count=$(wc -l < mutants-list.txt)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### Mutants diff: nothing to test" >> "$GITHUB_STEP_SUMMARY"
            echo "The diff generates no mutants (config-only or test-only change)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$count" -gt "$MUTANT_BUDGET" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Mutants diff: skipped — $count mutants exceeds the per-PR budget ($MUTANT_BUDGET)"
              echo "A diff this size is new-module territory: cover it with a dispatched"
              echo "module sweep (mutants-sweep.yml, #417) instead of a per-PR run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$count mutants in this diff (budget: $MUTANT_BUDGET)"
          fi
      - name: Test mutants in changed code
        if: steps.budget.outputs.run == 'true'
        run: |
          # Exit 2 (missed found) and 3 (timeouts found) are the
          # check's normal yield, reported below — never a red job.
          # Anything else (baseline failure, internal error) is real.
          #
          # --jobs 3 (#518): public-repo ubuntu-latest is 4 vCPU, and
          # one tree leaves cores idle — mutant builds tail into a
          # single-threaded link and the e2e tests spend real time
          # polling. Disk stays comfortable: incremental is off in the
          # mutants profile, so three scratch trees are ~3.3 GiB. If
          # contention starts pushing runs past the 3x-baseline
          # timeout (spurious `timeout` outcomes on mutants that pass
          # locally), drop back to --jobs 2 before touching
          # timeout_multiplier.
          set +e
          cargo mutants --profile=mutants --in-diff pr.diff --jobs 3
          code=$?
          set -e
          case "$code" in
            0|2|3) ;;
            *) echo "cargo mutants failed with exit code $code" >&2; exit "$code" ;;
          esac
      - name: Report results
        if: always() && steps.budget.outputs.run == 'true'
        run: |
          {
            echo "### Mutants diff (${{ steps.budget.outputs.count }} mutants)"
            for kind in caught missed unviable timeout; do
              count=$(wc -l < "mutants.out/$kind.txt" 2>/dev/null || echo 0)
              echo "- $kind: $count"
            done
            if [ -s mutants.out/missed.txt ]; then
              echo '#### Missed — add a test or `#[mutants::skip]` with a reason'
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Inline annotations on the Files-changed tab. GitHub caps
          # the warnings it displays per step (~10), so the first 10
          # go inline; the sticky comment below always carries the
          # full list. missed.txt lines are `file:line:col: message`.
          if [ -s mutants.out/missed.txt ]; then
            head -10 mutants.out/missed.txt | while IFS= read -r m; do
              file=${m%%:*}; rest=${m#*:}
              line=${rest%%:*}; rest=${rest#*:}
              col=${rest%%:*}; msg=${rest#*: }
              printf '::warning file=%s,line=%s,col=%s::missed mutant: %s\n' \
                "$file" "$line" "$col" "${msg//%/%25}"
            done
          fi
      # The sticky comment: one marker-keyed comment per PR, updated
      # in place so pushes don't stack notifications. Silent while
      # nothing was ever missed; once a comment exists it is kept
      # up to date, including flipping to all-caught when a later
      # push fixes the misses. Same-repo PRs only — a fork PR's
      # token is read-only and the step would just fail.
      - name: Upsert sticky PR comment
        if: always() && steps.budget.outputs.run == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          COUNT: ${{ steps.budget.outputs.count }}
        run: |
          marker='<!-- mutants-diff-report -->'
          missed=0
          [ -f mutants.out/missed.txt ] && missed=$(wc -l < mutants.out/missed.txt)
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -z "$existing" ] && [ "$missed" -eq 0 ]; then
            echo "no missed mutants and no prior comment - staying silent"
            exit 0
          fi
          {
            echo "$marker"
            if [ "$missed" -eq 0 ]; then
              echo "### Mutants diff: all $COUNT mutants caught ✅"
              echo ""
              echo "An earlier push missed some; this one catches everything."
            else
              echo "### Mutants diff: $missed of $COUNT mutants missed"
              echo ""
              echo 'Each line is a code change no test noticed. Add a test that'
              echo 'catches it, or mark it `#[mutants::skip]` with a reason comment.'
              echo ""
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
            fi
          } > comment.md
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@comment.md > /dev/null
          fi
      - uses: actions/upload-artifact@v7
        if: always() && steps.budget.outputs.run == 'true'
        with:
          name: mutants-in-diff
          path: |
            mutants.out/caught.txt
            mutants.out/missed.txt
            mutants.out/unviable.txt
            mutants.out/timeout.txt
            mutants.out/outcomes.json
          if-no-files-found: warn
          retention-days: 14
