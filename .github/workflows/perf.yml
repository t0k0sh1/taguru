name: Perf

# Base/head comparison needs a PR; push-to-main has nothing to compare
# against. Push-to-main still triggers this workflow so the
# `callgrind-regression` job runs once against main and saves a
# `Swatinem/rust-cache` entry scoped to the main branch — GitHub Actions
# caches are branch-scoped, and PR runs fall back to their base branch's
# cache when their own PR-ref cache is empty (always true for a PR's
# first run). Without this, every PR's first Perf run compiled
# gungraun-runner and the full release bench binary from scratch (~6
# minutes), because a pull_request-only trigger never leaves a cache on
# main to fall back to.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  callgrind-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Single checkout, fetch-depth: 0 so both the base and head SHAs
      # are reachable; the two runs below then `git checkout <sha>` in
      # place. A second `actions/checkout` would `git clean -ffdx` by
      # default and wipe the untracked target/gungraun/ baseline the
      # first run just saved — plain `git checkout` never touches
      # untracked files, so this stays safe.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Deliberately the same job id (callgrind-regression) for both
      # triggers: Swatinem/rust-cache derives its cache key from the job
      # id by default, so a push-to-main run and a pull_request run must
      # share a job id for the PR run's cache restore to ever match what
      # the push run saved.
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # A PR that adds (or temporarily removes) the `context` bench
      # target itself has nothing on the base side to compare against —
      # `cargo bench --bench context` fails outright rather than
      # producing an empty baseline. Detect that case via `cargo
      # metadata` (safe to run without a matching target; unlike
      # `cargo bench`, it never tries to resolve one) and skip straight
      # to an unguarded head run instead of failing the job.
      #
      # gungraun-runner is (re)installed here rather than once up front:
      # the runner's benchmark protocol must match the gungraun version
      # actually linked into *this* checkout's bench binary, and
      # base/head can pin different versions (e.g. a PR that bumps
      # gungraun itself). `cargo install` no-ops when the requested
      # version is already the one installed, so this is free when they
      # agree.
      - name: Benchmark base branch
        if: github.event_name == 'pull_request'
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          if cargo metadata --format-version=1 --no-deps \
              | jq -e '.packages[].targets[] | select(.name == "context" and (.kind | index("bench")))' \
              > /dev/null; then
            version=$(cargo metadata --format-version=1 | jq -r '.packages[] | select(.name == "gungraun").version')
            cargo install gungraun-runner --version "$version"
            cargo bench --bench context -- --save-baseline=pr_base
            echo "HAS_BASELINE=true" >> "$GITHUB_ENV"
          else
            echo "base branch has no 'context' bench target yet — skipping the baseline capture (likely the PR that adds it); head will run unguarded this once"
            echo "HAS_BASELINE=false" >> "$GITHUB_ENV"
          fi
      # soft_limits in benches/context.rs fails this step (exit code 3)
      # when Ir moves outside the configured regression margin.
      - name: Benchmark PR head
        if: github.event_name == 'pull_request'
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          version=$(cargo metadata --format-version=1 | jq -r '.packages[] | select(.name == "gungraun").version')
          cargo install gungraun-runner --version "$version"
          if [ "$HAS_BASELINE" = "true" ]; then
            cargo bench --bench context -- --baseline=pr_base
          else
            cargo bench --bench context
          fi
      # No PR to compare against on a plain push to main — just compile
      # gungraun-runner and the release bench binary so Swatinem/rust-cache
      # saves them under a main-branch-scoped cache entry (see the header
      # comment). Intentionally skips actually running the benchmark
      # under valgrind; that cost buys nothing here.
      - name: Warm gungraun-runner + bench build cache
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --format-version=1 | jq -r '.packages[] | select(.name == "gungraun").version')
          cargo install gungraun-runner --version "$version"
          cargo bench --bench context --no-run
