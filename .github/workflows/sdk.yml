name: SDK

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Both SDK integration suites drive the REAL server binary; build it once
  # and hand it to the language jobs as an artifact.
  build-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build server binary
        run: cargo build --locked --bin taguru
      - uses: actions/upload-artifact@v7
        with:
          name: taguru-server-binary
          path: target/debug/taguru

  python:
    needs: build-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Oldest supported (requires-python >= 3.10) plus the two most
        # recent stable releases.
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: taguru-server-binary
          path: bin
      - run: chmod +x bin/taguru
      - name: Install packages
        # setuptools rides along: the runner's tool-cache copy lags
        # behind known advisories, and the environment audit below
        # rightly refuses to look away. sdk/python-langchain's own [dev]
        # extra now carries pypdf (PdfConnector's tests, issue #348),
        # python-docx (DocxConnector's tests, issue #350), python-pptx
        # (PptxConnector's tests, issue #352), and boto3 plus its type
        # stubs (S3Connector's tests, issue #351); pypdf doubles as the
        # local_rag example's dependency (PDF text extraction) — no
        # separate `pip install pypdf` needed. The example isn't installed
        # from examples/langchain/requirements.txt because that file's
        # editable SDK paths are relative to being run from
        # examples/langchain, not the repo root this job runs from.
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e "sdk/python[dev]" -e "sdk/python-langchain[dev,pdf,docx,pptx,s3]"
      # Audit the environment the install step just resolved, the way the
      # typescript job audits its installed workspace. Handing pip-audit a
      # project directory re-resolves it from PyPI instead, which fails at
      # release time: the langchain package then requires a core version
      # the tag has not published yet. --skip-editable exempts only the
      # two local packages themselves; their dependency trees are still
      # audited. Runs before the OpenTelemetry SDK is installed further
      # down (see "Install OpenTelemetry SDK") — a deliberate gap, not an
      # oversight: that tree goes unaudited on this job, accepted because
      # it is a dev/test-only install (the `otel` extra itself pulls in
      # only `opentelemetry-api`, and even that stays optional for real
      # users) and the typescript job's `npm audit --workspaces` already
      # covers the equivalent dependency there.
      - name: Audit dependencies
        run: pip-audit --skip-editable
      - name: Lint (core)
        run: |
          ruff check sdk/python/src sdk/python/scripts sdk/python/tests
          ruff format --check sdk/python/src sdk/python/scripts sdk/python/tests
      - name: Lint (langchain)
        run: |
          ruff check sdk/python-langchain/src sdk/python-langchain/tests
          ruff format --check sdk/python-langchain/src sdk/python-langchain/tests
      - name: Typecheck
        run: |
          mypy --config-file sdk/python/pyproject.toml sdk/python/src
          mypy --config-file sdk/python-langchain/pyproject.toml sdk/python-langchain/src
      - name: Sync client freshness (unasync)
        run: |
          python sdk/python/scripts/generate_sync.py
          git diff --exit-code sdk/python/src/taguru/_sync
      - name: Surface parity
        run: python sdk/python/scripts/check_surface.py
      - name: Version lockstep (SDK packages carry the server's version)
        run: python sdk/spec/check_versions.py
      - name: Test (core)
        run: python -m pytest sdk/python/tests -q
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
      # `test_tracing.py` (ADR 0008, #224) `importorskip`s on
      # `opentelemetry.sdk.trace`, so the run just above proves the no-op
      # path really is a no-op in a genuinely OTel-less environment —
      # not that pytest merely skipped the otherwise-untested code. Only
      # after that does this job install the SDK package and run the
      # whole suite again to exercise the tracing tests for real. Order
      # matters: doing this before the plain run above would leave the
      # no-op path unverified.
      - name: Install OpenTelemetry SDK
        run: pip install "opentelemetry-sdk>=1.20,<2"
      - name: Test (core, with OpenTelemetry)
        run: python -m pytest sdk/python/tests -q
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
      - name: Test (langchain)
        run: python -m pytest sdk/python-langchain/tests -q
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
      # The use-case examples double as end-to-end smoke tests: each spawns
      # the real binary and runs offline on canned fake chat models.
      - name: Run examples
        run: |
          for main in examples/langchain/*/python/main.py; do
            echo "--- $main"
            python "$main"
          done
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru

  # Mutation testing for the core Python SDK, gated against the reviewed
  # `mutation-baseline.txt`: a survivor not on that allowlist fails the job.
  # Latest Python only (the mutants are logic, not version-specific, so one
  # interpreter suffices) and no server binary — it runs the hermetic unit
  # suite alone (`[tool.mutmut]`'s `pytest_add_cli_args_test_selection`), so
  # it needs neither `build-server` nor `TAGURU_TEST_BIN`. Core SDK only;
  # `sdk/python-langchain` leans on the server-backed integration suite for
  # its own coverage, so a hermetic mutation gate there would be mostly
  # noise (see `sdk/spec/check_mutants.py`).
  python-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the core SDK
        run: pip install -e "sdk/python[dev]"
      - name: Mutation gate (core SDK)
        run: python sdk/spec/check_mutants.py

  typescript:
    needs: build-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The declared engines floor (>=20) plus the two current LTS
        # lines. The floor stays 20 until 1.0.0 revisits engines.
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: taguru-server-binary
          path: bin
      - run: chmod +x bin/taguru
      - name: Install workspace
        run: npm install --no-fund --no-audit
        working-directory: sdk
      - name: Audit dependencies
        run: npm audit --workspaces --audit-level=high
        working-directory: sdk
      - name: Build packages (langchain-taguru consumes taguru's dist; the examples consume both)
        run: |
          npm run build --workspace=taguru
          npm run build --workspace=langchain-taguru
        working-directory: sdk
      - name: Lint
        run: |
          npm run lint --workspace=taguru
          npm run lint --workspace=langchain-taguru
        working-directory: sdk
      - name: Typecheck
        run: |
          npm run typecheck --workspace=taguru
          npm run typecheck --workspace=langchain-taguru
        working-directory: sdk
      - name: Surface parity
        run: npm run check:surface --workspace=taguru
        working-directory: sdk
      - name: Test (core)
        run: npm test --workspace=taguru
        working-directory: sdk
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
      - name: Test (langchain)
        run: npm test --workspace=langchain-taguru
        working-directory: sdk
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
      # The use-case examples double as end-to-end smoke tests: each spawns
      # the real binary and runs offline on canned fake chat models. Their
      # workspace pack-copies the file: SDK dependencies (see the .npmrc), so
      # this install must come after the build step above.
      - name: Install examples workspace
        run: npm install --no-fund --no-audit
        working-directory: examples/langchain
      - name: Run examples
        # npm's own workspace resolution, not a shell glob — */typescript
        # also matches node_modules/typescript (the compiler package).
        run: |
          npm run typecheck --workspaces
          npm run start --workspaces
        working-directory: examples/langchain
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru

  # Mutation testing for the core TypeScript SDK, gated against the reviewed
  # `sdk/typescript/mutation-baseline.txt`: an escaped mutant not on that
  # allowlist fails the job — the Stryker twin of `python-mutation` above.
  # One Node version only (the mutants are logic, not version-specific) and
  # no server binary — it runs the hermetic unit suite alone
  # (`vitest.stryker.config.ts`), so it needs neither `build-server` nor
  # `TAGURU_TEST_BIN`. Core SDK only; `sdk/typescript-langchain` leans on
  # the server-backed integration suite for its own coverage, the same
  # posture `sdk/python-langchain` takes (see `sdk/spec/check_mutants_ts.mjs`).
  typescript-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # npm install runs install-time scripts; don't leave GITHUB_TOKEN
          # in .git/config for them to read.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install workspace
        run: npm install --no-fund --no-audit
        working-directory: sdk
      - name: Mutation gate (core SDK)
        run: node sdk/spec/check_mutants_ts.mjs
