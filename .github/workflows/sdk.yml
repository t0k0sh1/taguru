name: SDK

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Both SDK integration suites drive the REAL server binary; build it once
  # and hand it to the language jobs as an artifact.
  build-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build server binary
        run: cargo build --locked --bin taguru
      - uses: actions/upload-artifact@v7
        with:
          name: taguru-server-binary
          path: target/debug/taguru

  # Lint, typecheck and test from the committed lockfiles (ADR 0049), so
  # a new upstream release can't turn an unrelated PR red. The audit
  # runs on the locked environments, which also catches a lockfile that
  # still pins a vulnerable version. `python-fresh` below covers what an
  # installing user resolves. Two environments, one per lockfile:
  # sdk/python-langchain's lock pulls in the core SDK (editable) but not
  # the core's own [dev] extra (unasync, mutmut). Steps call each
  # venv's interpreter directly, not `uv run`: `uv run` re-syncs by
  # default and would remove the OpenTelemetry SDK installed further down.
  python:
    needs: build-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Oldest supported (requires-python >= 3.11) plus the two most
        # recent stable releases.
        python-version: ["3.11", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      CORE_PY: sdk/python/.venv/bin/python
      LC_PY: sdk/python-langchain/.venv/bin/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v8
        with:
          name: taguru-server-binary
          path: bin
      - run: chmod +x bin/taguru
      # --locked fails if uv.lock no longer matches pyproject.toml. The
      # extras are the ones the tests exercise: sdk/python-langchain's own
      # [dev] extra carries pypdf (PdfConnector's tests, issue #348),
      # python-docx (#350), python-pptx (#352), boto3 plus its type stubs
      # (#351), and pypdf again as the local_rag example's dependency.
      - name: Install packages (locked)
        run: |
          uv sync --locked --project sdk/python --extra dev
          uv sync --locked --project sdk/python-langchain --extra dev --extra pdf --extra docx --extra pptx --extra s3
      # --skip-editable exempts only the local packages themselves; their
      # dependency trees are still audited. Runs before the OpenTelemetry
      # SDK is installed further down (see "Install OpenTelemetry SDK"),
      # a deliberate gap: that tree goes unaudited here, accepted because
      # it is a dev/test-only install (the `otel` extra itself pulls in
      # only `opentelemetry-api`, and even that stays optional for real
      # users) and the typescript job's `npm audit --workspaces` already
      # covers the equivalent dependency there.
      - name: Audit dependencies (locked)
        run: |
          "$CORE_PY" -m pip_audit --skip-editable
          "$LC_PY" -m pip_audit --skip-editable
      - name: Lint (core)
        run: |
          "$CORE_PY" -m ruff check sdk/python/src sdk/python/scripts sdk/python/tests
          "$CORE_PY" -m ruff format --check sdk/python/src sdk/python/scripts sdk/python/tests
      - name: Lint (langchain)
        run: |
          "$LC_PY" -m ruff check sdk/python-langchain/src sdk/python-langchain/tests
          "$LC_PY" -m ruff format --check sdk/python-langchain/src sdk/python-langchain/tests
      - name: Typecheck
        run: |
          "$CORE_PY" -m mypy --config-file sdk/python/pyproject.toml sdk/python/src
          "$LC_PY" -m mypy --config-file sdk/python-langchain/pyproject.toml sdk/python-langchain/src
      - name: Sync client freshness (unasync)
        run: |
          "$CORE_PY" sdk/python/scripts/generate_sync.py
          git diff --exit-code sdk/python/src/taguru/_sync
      - name: Surface parity
        run: '"$CORE_PY" sdk/python/scripts/check_surface.py'
      - name: Version lockstep (SDK packages carry the server's version)
        run: python sdk/spec/check_versions.py
      - name: Test (core)
        run: '"$CORE_PY" -m pytest sdk/python/tests -q'
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
      # `test_tracing.py` (ADR 0008, #224) `importorskip`s on
      # `opentelemetry.sdk.trace`, so the run just above proves the no-op
      # path really is a no-op in a genuinely OTel-less environment —
      # not that pytest merely skipped the otherwise-untested code. Only
      # after that does this job install the SDK package and run the
      # whole suite again to exercise the tracing tests for real. Order
      # matters: doing this before the plain run above would leave the
      # no-op path unverified.
      # Locked too: the `otel-test` dependency group (CI-only, never
      # published) is part of sdk/python's uv.lock.
      - name: Install OpenTelemetry SDK (locked)
        run: uv sync --locked --project sdk/python --extra dev --group otel-test
      - name: Test (core, with OpenTelemetry)
        run: '"$CORE_PY" -m pytest sdk/python/tests -q'
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
      - name: Test (langchain)
        run: '"$LC_PY" -m pytest sdk/python-langchain/tests -q'
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
      # The use-case examples double as end-to-end smoke tests: each spawns
      # the real binary and runs offline on canned fake chat models.
      - name: Run examples
        run: |
          for main in examples/langchain/*/python/main.py; do
            echo "--- $main"
            "$LC_PY" "$main"
          done
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru

  # What an installing user gets: a fresh resolve from PyPI, not the
  # lockfiles. The audit here is what flags a new advisory in the current
  # releases; the test runs flag an upstream release that breaks the
  # SDKs. Latest Python only. Auditing the installed environment rather
  # than a project directory matters at release time: re-resolving
  # sdk/python-langchain from PyPI then needs a core version the tag has
  # not published yet.
  python-fresh:
    needs: build-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: taguru-server-binary
          path: bin
      - run: chmod +x bin/taguru
      # setuptools rides along: the runner's tool-cache copy lags behind
      # known advisories, and the audit below rightly refuses to look away.
      - name: Install packages (fresh resolve)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e "sdk/python[dev]" -e "sdk/python-langchain[dev,pdf,docx,pptx,s3]"
      - name: Audit dependencies (fresh resolve)
        run: pip-audit --skip-editable
      - name: Test (core)
        run: python -m pytest sdk/python/tests -q
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
      - name: Test (langchain)
        run: python -m pytest sdk/python-langchain/tests -q
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru

  # Mutation testing for the core Python SDK, gated against the reviewed
  # `mutation-baseline.txt`: a survivor not on that allowlist fails the job.
  # Latest Python only (the mutants are logic, not version-specific, so one
  # interpreter suffices) and no server binary — it runs the hermetic unit
  # suite alone (`[tool.mutmut]`'s `pytest_add_cli_args_test_selection`), so
  # it needs neither `build-server` nor `TAGURU_TEST_BIN`. Core SDK only;
  # `sdk/python-langchain` leans on the server-backed integration suite for
  # its own coverage, so a hermetic mutation gate there would be mostly
  # noise (see `sdk/spec/check_mutants.py`).
  python-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.3
      # Locked like the `python` job: mutmut itself is a dev dependency
      # with no upper bound, and an unannounced mutmut release reaching
      # this gate is the drift ADR 0049 locks out.
      - name: Install the core SDK (locked)
        run: uv sync --locked --project sdk/python --extra dev
        env:
          UV_PYTHON: "3.14"
      - name: Mutation gate (core SDK)
        run: sdk/python/.venv/bin/python sdk/spec/check_mutants.py

  typescript:
    needs: build-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The declared engines floor (^22.13.0 || >=24, ADR 0049) plus the
        # current LTS line. 22.13 is pdfjs-dist's own floor
        # (`Promise.withResolvers`); the job's "22" resolves to the newest
        # 22.x, at or above it.
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: taguru-server-binary
          path: bin
      - run: chmod +x bin/taguru
      - name: Install workspace
        run: npm install --no-fund --no-audit
        working-directory: sdk
      # `npm audit` exits 1 both for a real finding and for a registry
      # outage (`audit endpoint returned an error` — 5xx or a network
      # timeout at registry.npmjs.org, seen four runs in a row on
      # 2026-09-04). Only the outage is retried; a finding fails on the
      # first attempt as before.
      # No pipe: this workflow declares no `shell`, so `run` gets `bash -e`
      # without `pipefail`, and `npm audit | tee` would return tee's exit
      # status — the gate judges npm's own.
      - name: Audit dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if npm audit --workspaces --audit-level=high > audit.log 2>&1; then
              cat audit.log
              exit 0
            fi
            cat audit.log
            if ! grep -q "audit endpoint returned an error" audit.log || [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "::warning::npm audit endpoint error (attempt ${attempt}/5); retrying"
            sleep $((attempt * 30))
          done
          exit 1
        working-directory: sdk
      - name: Build packages (langchain-taguru consumes taguru's dist; the examples consume both)
        run: |
          npm run build --workspace=taguru
          npm run build --workspace=langchain-taguru
        working-directory: sdk
      - name: Lint
        run: |
          npm run lint --workspace=taguru
          npm run lint --workspace=langchain-taguru
        working-directory: sdk
      - name: Typecheck
        run: |
          npm run typecheck --workspace=taguru
          npm run typecheck --workspace=langchain-taguru
        working-directory: sdk
      - name: Surface parity
        run: npm run check:surface --workspace=taguru
        working-directory: sdk
      # typecheck/lint/test all exercise the sources or the ESM build;
      # nothing above ever EXECUTED the CJS bundles, which is exactly
      # how issue #740 (require("taguru/testing") crashing at load on
      # import.meta) shipped past #556's machine checks.
      - name: CJS entry points load under require()
        run: npm run check:cjs --workspace=taguru
        working-directory: sdk
      - name: Test (core)
        run: npm test --workspace=taguru
        working-directory: sdk
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
      - name: Test (langchain)
        run: npm test --workspace=langchain-taguru
        working-directory: sdk
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
      # The use-case examples double as end-to-end smoke tests: each spawns
      # the real binary and runs offline on canned fake chat models. Their
      # workspace pack-copies the file: SDK dependencies (see the .npmrc), so
      # this install must come after the build step above.
      - name: Install examples workspace
        run: npm install --no-fund --no-audit
        working-directory: examples/langchain
      - name: Run examples
        # npm's own workspace resolution, not a shell glob — */typescript
        # also matches node_modules/typescript (the compiler package).
        run: |
          npm run typecheck --workspaces
          npm run start --workspaces
        working-directory: examples/langchain
        env:
          TAGURU_TEST_BIN: ${{ github.workspace }}/bin/taguru
