# Prometheus + Grafana pointed at a running taguru's /metrics.
# taguru itself is NOT started here — bring your own (a local
# `cargo run`, `deploy/docker-compose.yml`, or a real deployment) and
# point prometheus.yml at it. Validated topology: taguru as a host
# process, scraped via `host.docker.internal` — the extra_hosts line
# below only makes that name resolve on Linux (Docker Desktop already
# does); taguru itself still has to bind somewhere the container's
# gateway route reaches, i.e. TAGURU_ADDR=0.0.0.0:8248, not the
# loopback-only default (README's "Start taguru" step).
#
#   docker compose up -d
#   open http://localhost:3000   # admin/admin, change on first login
#
# The "taguru" dashboard is provisioned automatically — no manual
# import. Prometheus itself is on http://localhost:9090.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # no-op on Docker Desktop, required on Linux
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
