[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-taguru"
version = "0.8.0"
description = "LangChain integration for the Taguru long-term semantic memory server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Takashi Yamashina" }]
keywords = ["taguru", "langchain", "llm", "memory", "rag", "retriever"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "taguru>=0.8.0,<0.9.0",
    "langchain-core>=1.0.0,<2.0.0",
    # Already in the tree transitively via `taguru` (its only runtime
    # dependency); made direct because `HtmlConnector` (issue #349) imports
    # it itself for URL fetches, so `pip-audit`'s tree shows the real
    # importer rather than an implicit pass-through.
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/t0k0sh1/taguru"
Repository = "https://github.com/t0k0sh1/taguru"

[tool.uv.sources]
# Without this, `uv sync` resolves `taguru` from PyPI instead of this
# repo's own sdk/python — so a local change there (or a stale .venv
# predating one) silently goes untested here, the same class of drift
# npm workspaces rule out for the TS twin (sdk/package.json).
taguru = { path = "../python", editable = true }

[project.optional-dependencies]
# ADR 0007 §3/§4's packaging decision, kept for PdfConnector (issue #348):
# a connector's own parser dependency is never forced on every install —
# only a caller who actually uses PdfConnector needs pypdf.
pdf = [
    "pypdf>=5",
]
# Same ADR 0007 §3/§4 decision, for DocxConnector (issue #350): only a
# caller who actually uses DocxConnector needs python-docx. >=1.2 for its
# bundled `py.typed` marker (this package's own mypy is `strict`).
docx = [
    "python-docx>=1.2",
]
# Same ADR 0007 §3/§4 decision, for PptxConnector (issue #352): only a
# caller who actually uses PptxConnector needs python-pptx. >=1.0 for its
# bundled `py.typed` marker (this package's own mypy is `strict`).
pptx = [
    "python-pptx>=1.0",
]
# Same ADR 0007 §3/§4 decision, for S3Connector (issue #351): only a caller
# who actually uses S3Connector needs boto3 — `FileObjectStore` (the
# `file://` test/air-gapped backend) is stdlib-only and needs neither this
# extra nor any of pdf/docx to exist on its own.
s3 = [
    "boto3>=1.35",
]
# Same decision again for the two backends issue #414 adds to the same
# object-storage boundary: each cloud's SDK rides its own extra, so a
# GCS-only (or Azure-only, or file://-only) caller never installs the
# other clouds' client libraries.
gcs = [
    "google-cloud-storage>=2.14",
]
azure = [
    "azure-storage-blob>=12.19",
    "azure-identity>=1.17",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "langchain-tests>=1.0.0",
    "pip-audit>=2.7",
    # Validates MODEL_OUTPUT_JSON_SCHEMA against the shared accepted/rejected
    # fixture corpus (../../tests/fixtures/model_output) — tests-only, never
    # imported by src/.
    "jsonschema>=4.18",
    # PdfConnector's own tests (tests/unit/test_pdf_connector.py) exercise
    # the real pypdf-backed path, not a mock.
    "pypdf>=5",
    # DocxConnector's own tests (tests/unit/test_docx_connector.py) exercise
    # the real python-docx-backed path, not a mock.
    "python-docx>=1.2",
    # PptxConnector's own tests (tests/unit/test_pptx_connector.py) exercise
    # the real python-pptx-backed path, not a mock.
    "python-pptx>=1.0",
    # S3Connector's own tests (tests/unit/test_object_store.py,
    # tests/unit/test_s3_connector.py) exercise the real boto3-backed path
    # (stubbed at the HTTP layer, never a live bucket) rather than a mock of
    # our own making.
    "boto3>=1.35",
    # This package's own mypy is `strict`; boto3 ships no inline types, so
    # its stub package is what lets `S3ObjectStore` type-check at all.
    "boto3-stubs[s3]>=1.35",
    # GCSObjectStore / AzureBlobObjectStore tests (issue #414) exercise the
    # real client libraries' types and exceptions — never a mock exception
    # hierarchy of our own making.
    "google-cloud-storage>=2.14",
    "azure-storage-blob>=12.19",
    "azure-identity>=1.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taguru_langchain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

# google-cloud-storage ships no py.typed marker (google-api-core and
# google-auth do) and has no maintained stub package the way boto3-stubs
# covers boto3 — its objects type as Any inside objectstore_gcs.py only.
[[tool.mypy.overrides]]
module = ["google.cloud", "google.cloud.storage"]
ignore_missing_imports = true
