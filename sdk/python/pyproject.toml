[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taguru"
version = "0.8.0"
description = "Python client SDK for the Taguru long-term semantic memory server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Takashi Yamashina" }]
keywords = ["taguru", "llm", "memory", "rag", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1.0"]

[project.urls]
Homepage = "https://github.com/t0k0sh1/taguru"
Repository = "https://github.com/t0k0sh1/taguru"

[project.optional-dependencies]
# Span creation only needs the API package (see `taguru._tracing`); the
# SDK implementation (exporters, `TracerProvider`) is the application's
# choice and stays out of this extra.
otel = ["opentelemetry-api>=1.20,<2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "unasync>=0.6",
    "pyyaml>=6",
    "pip-audit>=2.7",
    # Mutation testing, gated in CI against `mutation-baseline.txt` via
    # `sdk/spec/check_mutants.py`. Core SDK only — see that script's docstring.
    "mutmut>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taguru"]

[tool.mutmut]
source_paths = ["src/taguru/"]
# integrationテストはサーバーバイナリ(TAGURU_TEST_BIN)前提なので、
# hermeticなunitテストだけをミュータント判定に使う。
pytest_add_cli_args_test_selection = ["tests/unit/"]
# _async/_sync のクライアント本体は実サーバー相手のintegrationテストが
# 担当領域で、unitテストだけでは大半のミュータントが判定不能(no tests)に
# なりノイズにしかならないため除外する。_sync はさらに generate_sync.py の
# 自動生成物でもある。testing.py はユーザー向けテストヘルパーで同様に
# integration側でのみ実行される。
do_not_mutate = [
    "src/taguru/_async/*",
    "src/taguru/_sync/*",
    "src/taguru/testing.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # `object` is a wire-faithful parameter name on query(); shadowing the
    # builtin there is a deliberate parity choice with the server vocabulary.
    "A002",
]

[tool.ruff.lint.per-file-ignores]
# Generated by scripts/generate_sync.py; import order and yield style are
# artifacts of the unasync token replacement.
"src/taguru/_sync/client.py" = ["I001", "UP028"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# `opentelemetry-api` is optional (the `otel` extra) — CI's mypy job
# installs `dev` only, so the package is genuinely absent there. This
# override, not a `# type: ignore[import-not-found]` comment, is what
# makes `taguru._tracing` typecheck identically whether or not a
# developer's own environment happens to have it installed too (a
# comment-based ignore flips to "unused" the moment the package IS
# present and ships its own `py.typed` types).
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true
