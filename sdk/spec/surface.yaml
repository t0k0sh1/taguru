# The cross-language surface spec: one entry per logical operation.
#
# Both SDKs must expose exactly this surface. Python names are canonical;
# TypeScript method names are derived mechanically (snake_case → camelCase).
# `args` are positional parameters; `options` are Python keyword-only
# parameters / TypeScript trailing-options-object keys (snake_case in both).
# `route` is documentation. Checked in CI by check_python.py and
# check_typescript.ts; drift fails the build.

functions:
  citation_key:
    args: [source, paragraph]

classes:
  Taguru:
    health: { route: "GET /health" }
    live: { route: "GET /live" }
    metrics: { route: "GET /metrics" }
    protocol: { route: "GET /protocol" }
    flush: { route: "POST /flush" }
    import_batches: { route: "POST /import", args: [data] }
    import_file: { route: "POST /import", args: [path] }
    wait_until_ready: { options: [timeout, interval] }
    context: { args: [name] }
    recall:
      route: "POST /recall"
      args: [cue]
      options: [contexts, groups, limit, after]
    query:
      route: "POST /query"
      options: [contexts, groups, subject, label, object, subject_types, object_types, limit, after]
    search_passages:
      route: "POST /sources/search"
      args: [query]
      options: [contexts, groups, limit, semantic_floor, tags, since, until]
    close: {}

  Contexts:
    list: { route: "GET /contexts", options: [limit, after, after_id, pinned] }
    iter: { route: "GET /contexts", options: [limit, pinned] }
    get: { route: "GET /contexts/{id}", args: [context_id] }
    exists: { route: "GET /contexts/{id}", args: [context_id] }
    create:
      route: "POST /contexts"
      args: [name]
      options: [description, pinned, dice_floor, semantic_floor]
    update:
      route: "PATCH /contexts/{id}"
      args: [context_id]
      options: [description, pinned, dice_floor, semantic_floor]
    delete: { route: "DELETE /contexts/{id}", args: [context_id] }
    rename: { route: "POST /contexts/{id}/rename", args: [context_id, to] }

  Groups:
    list: { route: "GET /groups", options: [limit, after] }
    iter: { route: "GET /groups", options: [limit] }
    get: { route: "GET /groups/{name}", args: [name] }
    exists: { route: "GET /groups/{name}", args: [name] }
    create:
      route: "PUT /groups/{name}"
      args: [name]
      options: [description, contexts, groups]
    update:
      route: "PATCH /groups/{name}"
      args: [name]
      options: [description, add_contexts, remove_contexts, add_groups, remove_groups]
    delete: { route: "DELETE /groups/{name}", args: [name] }
    rename: { route: "POST /groups/{name}/rename", args: [name, to] }
    export: { route: "GET /groups/{name}/export", args: [name] }

  Context:
    resolve:
      route: "POST /contexts/{id}/resolve"
      args: [cue]
      options: [dice_floor, semantic_floor, limit]
    resolve_label:
      route: "POST /contexts/{id}/resolve_label"
      args: [cue]
      options: [dice_floor, semantic_floor, limit]
    explain_resolve:
      route: "POST /contexts/{id}/resolve/explain"
      args: [cue, expected]
      options: [dice_floor, semantic_floor, limit]
    explain_resolve_label:
      route: "POST /contexts/{id}/resolve_label/explain"
      args: [cue, expected]
      options: [dice_floor, semantic_floor, limit]
    describe: { route: "POST /contexts/{id}/describe", args: [concept] }
    query:
      route: "POST /contexts/{id}/query"
      options: [subject, label, object, subject_types, object_types, limit, after, since, until]
    recall:
      route: "POST /contexts/{id}/recall"
      args: [cue]
      options: [limit, after, since, until]
    activate:
      route: "POST /contexts/{id}/activate"
      args: [origins]
      options: [decay, limit, since, until]
    explore:
      route: "POST /contexts/{id}/explore"
      args: [origins]
      options: [max_depth, limit, after, since, until]
    paths:
      route: "POST /contexts/{id}/paths"
      args: [origins, targets]
      options: [max_depth, limit]
    changes:
      route: "GET /contexts/{id}/changes"
      options: [since, limit]
    unreachable_from:
      route: "POST /contexts/{id}/unreachable_from"
      args: [origins]
      options: [limit, after]
    list_labels: { route: "GET /contexts/{id}/labels", options: [limit, after, prefix] }
    iter_labels: { route: "GET /contexts/{id}/labels", options: [limit, prefix] }
    get_schema: { route: "GET /contexts/{id}/schema" }
    put_schema:
      route: "PUT /contexts/{id}/schema"
      args: [document]
    audit_schema:
      route: "POST /contexts/{id}/schema/audit"
      options: [limit, after]
    validate_schema:
      route: "POST /contexts/{id}/schema/validate"
      args: [document]
      options: [limit, after]
    add_associations:
      route: "POST /contexts/{id}/associations"
      args: [associations]
    add_associations_batched:
      route: "POST /contexts/{id}/associations"
      args: [associations]
      options: [chunk_size, max_chunk_bytes]
    retract_association:
      route: "POST /contexts/{id}/associations/retract"
      args: [subject, label, object]
    store_passages:
      route: "POST /contexts/{id}/sources"
      args: [passages]
      options: [questions, sections, locators, tags, dates]
    lookup_passages: { route: "POST /contexts/{id}/sources/lookup", args: [sources] }
    search_passages:
      route: "POST /contexts/{id}/sources/search"
      args: [query]
      options: [limit, semantic_floor, tags, since, until]
    search_communities:
      route: "POST /contexts/{id}/communities/search"
      args: [query]
      options: [limit, semantic_floor, derived]
    analyze_communities: { route: "GET /contexts/{id}/communities" }
    explain_search_passages:
      route: "POST /contexts/{id}/sources/search/explain"
      args: [query, source]
      options: [paragraph, limit, semantic_floor, tags, since, until]
    retract_source:
      route: "POST /contexts/{id}/sources/retract"
      args: [source]
      options: [dry_run]
    list_sources: { route: "GET /contexts/{id}/sources", options: [limit, after, prefix] }
    iter_sources: { route: "GET /contexts/{id}/sources", options: [limit, prefix] }
    cite_passage: { route: "POST /contexts/{id}/citations", args: [source, paragraph] }
    get_aliases: { route: "GET /contexts/{id}/aliases", options: [limit, after, prefix] }
    iter_aliases: { route: "GET /contexts/{id}/aliases", options: [limit, prefix] }
    add_aliases: { route: "POST /contexts/{id}/aliases", options: [concepts, labels] }
    remove_aliases: { route: "DELETE /contexts/{id}/aliases", options: [concepts, labels] }
    audit_vocabulary:
      route: "POST /contexts/{id}/vocabulary/audit"
      options: [dice_floor, cosine_floor]
    audit_drift:
      route: "POST /contexts/{id}/drift/audit"
      options: [unsourced_floor, limit, after, include_twins, dice_floor, cosine_floor]
    audit_consolidation:
      route: "POST /contexts/{id}/consolidation/audit"
      args: [checks]
      options: [limit, evidence_cap, dice_floor, cosine_floor, floor_secs]
    refresh_embeddings: { route: "POST /contexts/{id}/embeddings/refresh" }
    embeddings_status: { route: "GET /contexts/{id}/embeddings" }
    compact: { route: "POST /contexts/{id}/compact" }
    promote:
      route: "POST /contexts/{id}/promote"
      args: [into, sources]
      options: [audit, dry_run]
    export: { route: "GET /contexts/{id}/export" }
    export_stream: { route: "GET /contexts/{id}/export" }
    export_to_file: { route: "GET /contexts/{id}/export", args: [path] }
    assemble_evidence:
      route: "POST /contexts/{id}/evidence"
      args: [origins]
      options:
        - labels
        - dice_floor
        - semantic_floor
        - resolve_limit
        - activate_decay
        - activate_limit
        - text_fallback_query
        - search_limit
        - include_communities
        - budget
        - rerank
    retrieve:
      args: [origins]
      options:
        - labels
        - dice_floor
        - semantic_floor
        - resolve_limit
        - auto_pick
        - activate_decay
        - activate_limit
        - describe_first
        - fetch_citations
        - text_fallback_query
        - text_fallback_only_if_empty
        - search_limit
